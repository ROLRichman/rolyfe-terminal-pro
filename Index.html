<div id="app"></div>

<style>
body{
margin:0;
background:linear-gradient(180deg,#020617,#001a12,#020617);
color:#e2e8f0;
font-family:Arial;
}

#app{padding:10px}

h2{
text-align:center;
color:#22c55e;
}

/* TOP BAR */
.topbar{
position:sticky;
top:0;
background:#020617;
padding:10px;
display:flex;
flex-wrap:wrap;
gap:6px;
z-index:999;
border-bottom:1px solid #111;
}

select{
padding:8px;
border-radius:6px;
background:#111;
color:#fff;
border:none;
}

/* SECTION */
.section{
margin-top:15px;
padding:12px;
background:#0b0f1a;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
gap:8px;
}

.cell{
background:#111;
padding:8px;
border-radius:8px;
text-align:center;
cursor:pointer;
font-size:12px;
transition:0.2s;
}

.cell:hover{
transform:scale(1.05);
}

/* SIGNAL COLORS */
.buy{
box-shadow:0 0 12px #22c55e;
}

.sell{
box-shadow:0 0 12px #ef4444;
}

/* ALERT */
.alert{
position:fixed;
right:10px;
padding:10px;
background:#000;
border-radius:8px;
z-index:999;
font-size:12px;
}

/* CHART */
#chart{height:500px}
.data-safety{border:1px solid #8a6a32;background:#241e12;color:#f8e6bc;padding:12px;border-radius:10px;margin:12px 0;font-size:13px;line-height:1.5}
.tv-news-panel{margin-top:14px;padding:12px;background:#0b0f1a;border:1px solid #263b4d;border-radius:12px}
.tv-news-panel summary{cursor:pointer;font-weight:800;color:#8df0c1}
.tv-news-widget{min-height:520px;width:100%;margin-top:12px}
.tv-news-widget .tradingview-widget-container__widget{min-height:520px}
.tv-news-attribution{font-size:11px;color:#9fb3c7;padding-top:8px}
.tv-news-attribution a{color:#80c7ff}

</style>

<h2>🚀 RO’LYFE TERMINAL PRO</h2>

<div class="topbar">
<select id="symbol"></select>

<select id="mode">
<option value="live">LIVE</option>
<option value="sniper">SNIPER</option>
</select>
</div>

<div class="data-safety"><b>DATA CONNECTOR NOT ACTIVE.</b> The exposed browser API key has been removed. Live BUY/SELL alerts stay disabled until a secure server-side quote feed is connected and verified.</div>
<div class="section">
<div id="chart"></div>
</div>
<details class="tv-news-panel" id="tradingViewNewsPanel" open>
<summary>📰 TradingView Top Stories · Market News</summary>
<div class="tradingview-widget-container tv-news-widget">
  <div class="tradingview-widget-container__widget"></div>
  <div class="tv-news-attribution"><a href="https://www.tradingview.com/news/" target="_blank" rel="noopener">TradingView News</a></div>
  <script type="application/json" class="tv-news-widget-config">{"feedMode":"all_symbols","isTransparent":true,"displayMode":"regular","width":"100%","height":520,"colorTheme":"dark","locale":"en"}</script>
</div>
</details>

<div class="section">
<h3>🔥 Live Watchlist</h3>
<div id="watch" class="grid"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// Live provider key removed from browser code. Connect through a server-side market-data adapter before enabling signals.

let watchlist = [
"AAPL","TSLA","NVDA","SPY","QQQ",
"MSFT","AMZN","META","GOOGL",
"AMD","PLTR","COIN"
];

let symbol = "AAPL";

window.onload = ()=>{
let sel=document.getElementById("symbol");
watchlist.forEach(s=>{
let o=document.createElement("option");
o.value=s;o.text=s;
sel.appendChild(o);
});
loadChart();
render();
};

/* CHART */
function loadChart(){
document.getElementById("chart").innerHTML="";
new TradingView.widget({
container_id:"chart",
symbol:symbol,
interval:"15",
theme:"dark",
studies:[
"RSI@tv-basicstudies",
"MACD@tv-basicstudies"
]
});
}

/* SECURE DATA GATE
   No provider key is stored in this page. Until a server-side data adapter
   is connected and its responses are verified, this terminal does not
   generate directional alerts from stale, sample, or unavailable data.
*/
async function getData(_sym){return null;}

/* SIGNAL ENGINE · FAIL CLOSED */
function computeSignal(data){
if(!data || !Number.isFinite(Number(data.dp))) return "WAIT";
return "WAIT"; // Re-enable only after a verified provider response is wired.
}

/* ALERT */
function fireAlert(sym,act,price){
let d=document.createElement("div");
d.className="alert";
d.style.top=(60+document.querySelectorAll(".alert").length*50)+"px";
d.style.color=act==="BUY"?"#22c55e":"#ef4444";
d.innerText=`${act} ${sym} @ ${price}`;
document.body.appendChild(d);
setTimeout(()=>d.remove(),3500);
}

/* RENDER */
async function render(){
let container=document.getElementById("watch");
container.innerHTML="";

for(let sym of watchlist){

let data = await getData(sym);

let price = data?.c || "-";
let action = computeSignal(data);

let div=document.createElement("div");
div.className="cell "+(action==="BUY"?"buy":action==="SELL"?"sell":"");

div.innerText = `${sym}
$${price}
${action}`;

div.onclick=()=>{
symbol=sym;
loadChart();
};

container.appendChild(div);

if(action!=="WAIT"){
fireAlert(sym,action,price);
}
}
}

/* LOOP (SAFE RATE) */
function loop(){
render();
setTimeout(loop,20000); // retained only for future server-side data refresh
}

</script>
<script>(() => {
 const panel=document.getElementById("tradingViewNewsPanel");
 if(!panel)return;
 let loaded=false;
 const load=()=>{
  if(loaded)return;
  const configNode=panel.querySelector(".tv-news-widget-config");
  const container=panel.querySelector(".tv-news-widget");
  if(!configNode||!container)return;
  let config;try{config=JSON.parse(configNode.textContent||"{}");}catch(_){return;}
  const script=document.createElement("script");
  script.src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
  script.async=true;script.textContent=JSON.stringify(config);container.appendChild(script);loaded=true;
 };
 if(panel.open)load();
 panel.addEventListener("toggle",()=>{if(panel.open)load();});
})();</script>
